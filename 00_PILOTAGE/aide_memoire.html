<title>Aide-mémoire Krazystory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête collant (titre, recherche, filtre de statut, onglets), puis un panneau par onglet ; en recherche, tous les panneaux s'affichent filtrés. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --surface-2:#e9efea; --ink:#13201a; --ink-2:#465850; --ink-3:#7b8b83;
  --rule:#d6e0da; --mana:#0c8f60; --mana-soft:#d8f1e5; --a:#2a6fc9; --b:#d75a24;
  --st-canon:#13201a; --st-canon-ink:#ffffff; --st-source:#465850; --st-interp:#7247b8; --st-prop:#2f6f8f;
  --st-manq:#a86500; --st-conflit:#c23434; --st-hyp:#0f7f86; --mark:#fff0a8;
  --f-display:"Marcellus", "Trajan Pro", Georgia, serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2622; --ink:#e6eee9; --ink-2:#a9b8b0; --ink-3:#77877f;
  --rule:#29352f; --mana:#3fcf92; --mana-soft:#163327; --a:#5b9cf0; --b:#f08250;
  --st-canon:#e6eee9; --st-canon-ink:#0e1412; --st-source:#a9b8b0; --st-interp:#ab8bf0; --st-prop:#6fb2d4;
  --st-manq:#e6a43a; --st-conflit:#f07171; --st-hyp:#47c2c9; --mark:#5b4d0f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --surface-2:#1c2622; --ink:#e6eee9; --ink-2:#a9b8b0; --ink-3:#77877f;
  --rule:#29352f; --mana:#3fcf92; --mana-soft:#163327; --a:#5b9cf0; --b:#f08250;
  --st-canon:#e6eee9; --st-canon-ink:#0e1412; --st-source:#a9b8b0; --st-interp:#ab8bf0; --st-prop:#6fb2d4;
  --st-manq:#e6a43a; --st-conflit:#f07171; --st-hyp:#47c2c9; --mark:#5b4d0f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--mana)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.55rem}
h3{font-size:1.15rem}
p{margin:0}
ul{margin:0;padding-left:18px;display:grid;gap:5px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:1.35rem}
.brand small{color:var(--ink-3);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 360px;max-width:560px}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;padding:8px 32px 8px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);cursor:pointer;padding:4px 8px;font-size:16px}
select#statut{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);flex:0 1 auto;max-width:100%}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:8px 12px 9px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--mana)}
.searchinfo{font-size:13px;color:var(--ink-2);padding-block:8px}

main{padding-block:26px 64px}
section.panel{display:grid;gap:22px}
section.panel + section.panel{margin-top:40px}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.panel-head p{color:var(--ink-2);max-width:70ch}
.lede{color:var(--ink-2);max-width:72ch}

/* Grilles et blocs */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.box h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.box .id{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.grp{display:grid;gap:12px}
.grp > h3{padding-bottom:6px;border-bottom:1px solid var(--rule)}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;min-width:0}
.kv > div{display:contents}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* Badges de statut */
.st{display:inline-block;font-family:var(--f-mono);font-size:10.5px;line-height:1;padding:3px 5px 2px;border-radius:4px;border:1px solid currentColor;vertical-align:1px;white-space:nowrap;font-weight:500;letter-spacing:.02em}
.st.canon{background:var(--st-canon);color:var(--st-canon-ink);border-color:var(--st-canon)}
.st.source{color:var(--st-source)}
.st.interp{color:var(--st-interp)}
.st.prop{color:var(--st-prop);border-style:dashed}
.st.manq{color:var(--st-manq)}
.st.conflit{color:var(--st-conflit)}
.st.hyp{color:var(--st-hyp);border-style:dashed}
.ref{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.star{color:var(--mana);font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* Tableaux */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td.A{color:var(--a)} td.B{color:var(--b)}
table.cult{min-width:640px}
table.cult td:first-child{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.exam td{background:var(--mana-soft)}

/* Aperçu */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:stretch}
.hero figure{margin:0;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);min-height:220px}
.hero figure img{width:100%;height:100%;object-fit:cover;display:block}
.hero figcaption{position:absolute;left:10px;bottom:10px;background:var(--surface);border-radius:6px;padding:3px 9px;font-weight:600;font-size:13px}
.hero figure.A figcaption{color:var(--a)} .hero figure.B figcaption{color:var(--b)}
.pitch{display:grid;gap:12px;align-content:center;padding:6px 4px}
.pitch h2{font-size:1.9rem;line-height:1.15}
.pitch p{font-size:15.5px;max-width:62ch}
@media (max-width:820px){.hero{grid-template-columns:1fr 1fr}.pitch{grid-column:1/-1;order:-1}}
.duo{display:grid;grid-template-columns:auto 1fr 1fr;font-size:14px;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--surface)}
.duo > div{padding:8px 12px;border-bottom:1px solid var(--rule);min-width:0}
.duo > div:nth-last-child(-n+3){border-bottom:0}
.duo .h{font-weight:700;background:var(--surface-2)}
.duo .k{color:var(--ink-3);font-weight:600;font-size:13px}
.duo .a{color:var(--a)} .duo .b{color:var(--b)}
.duo .a.h,.duo .b.h{font-family:var(--f-display);font-weight:400;font-size:1.1rem}
.progress{display:grid;gap:8px}
.progress div{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:14px;padding-bottom:8px;border-bottom:1px dashed var(--rule)}
.progress div:last-child{border-bottom:0}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;align-self:start}
.pill.ok{background:var(--mana-soft);color:var(--mana)}
.pill.wip{background:var(--surface-2);color:var(--st-manq)}
.pill.no{background:var(--surface-2);color:var(--ink-3)}
.pill.open{background:var(--surface-2);color:var(--st-conflit)}

/* Personnages */
.hero-card{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;border-top:4px solid var(--c)}
.hero-card.A{--c:var(--a)} .hero-card.B{--c:var(--b)}
.hero-card .pic{display:grid;gap:8px;align-content:start}
.hero-card .pic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in;max-width:100%}
.hero-card .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hero-card .thumbs img{aspect-ratio:1;border-radius:5px}
.hero-card h3{font-size:1.6rem;color:var(--c)}
.hero-body{display:grid;gap:14px;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.cols > div{display:grid;gap:6px;align-content:start;min-width:0}
@media (max-width:640px){.hero-card{grid-template-columns:1fr}.hero-card .pic{grid-template-columns:120px 1fr;align-items:start}.hero-card .thumbs{grid-template-columns:repeat(2,1fr)}}

/* Chronologie */
.tl{display:grid;gap:0;position:relative;padding-left:4px}
.tl .ev{display:grid;grid-template-columns:86px 18px minmax(0,1fr);gap:0 10px;align-items:start}
.tl .age{font-family:var(--f-mono);font-size:13px;text-align:right;padding-top:9px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl .dot{position:relative;align-self:stretch}
.tl .dot::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--rule)}
.tl .dot::after{content:"";position:absolute;left:3px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3)}
.tl .ev.cat .dot::after{border-color:var(--st-conflit);background:var(--st-conflit)}
.tl .ev.key .dot::after{border-color:var(--mana);background:var(--mana)}
.tl .txt{padding:7px 0 12px;font-size:14px;min-width:0}
.tl .txt b{font-weight:600}
.era{display:grid;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Catastrophes */
.cat-card{border-left:4px solid var(--st-conflit)}
.cat-card .age{font-family:var(--f-mono);font-size:12px;color:var(--st-conflit);font-weight:500}
.cat-card .layers{display:grid;gap:8px;font-size:14px}
.cat-card .layers > div{display:grid;gap:2px}
.drift{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.drift > div{padding:10px 12px;display:grid;gap:2px;font-size:13.5px;background:var(--surface)}
.drift > div:nth-child(1){box-shadow:inset 0 -4px 0 var(--mana)}
.drift > div:nth-child(2){box-shadow:inset 0 -4px 0 var(--st-manq)}
.drift > div:nth-child(3){box-shadow:inset 0 -4px 0 var(--st-conflit)}
.drift b{font-size:13px}
@media (max-width:560px){.drift{grid-template-columns:1fr}}

/* Contradictions */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.imp{font-size:12px;font-weight:600}
.imp.Haute{color:var(--st-conflit)} .imp.Moyenne{color:var(--st-manq)} .imp.Faible{color:var(--ink-3)}
.prio{font-family:var(--f-mono);font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--surface-2)}
.prio.p1{color:var(--st-conflit)} .prio.p2{color:var(--st-manq)} .prio.p3{color:var(--ink-3)}
.pistes{display:grid;gap:4px;font-size:14px;padding-left:0;list-style:none}
.pistes li{display:grid;grid-template-columns:22px 1fr;gap:4px}
.pistes li span:first-child{font-family:var(--f-mono);color:var(--st-prop)}

/* Galerie */
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(46%,170px),1fr))}
.gallery figure{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:zoom-in}
.gallery figure img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.gallery figcaption{padding:8px 10px;font-size:12.5px;display:grid;gap:2px}
.gallery figcaption b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
dialog#lb{border:0;padding:0;background:transparent;max-width:min(92vw,900px);width:100%;color:var(--ink)}
dialog#lb::backdrop{background:rgb(5 10 8 / .82)}
dialog#lb .lbin{background:var(--surface);border-radius:12px;overflow:hidden;display:grid}
dialog#lb img{width:100%;max-height:72vh;object-fit:contain;background:#000;display:block}
dialog#lb .cap{padding:12px 16px;display:flex;gap:12px;align-items:start;justify-content:space-between}
dialog#lb .cap p{font-size:14px}
dialog#lb button{border:1px solid var(--rule);background:var(--surface-2);border-radius:8px;padding:5px 12px;cursor:pointer;flex:0 0 auto}

/* Glossaire */
.gloss{display:grid;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
.gloss > div{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:4px 18px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.gloss > div:last-child{border-bottom:0}
.gloss dt{font-family:var(--f-display);font-size:1.1rem}
.gloss dd{margin:0;display:grid;gap:4px;font-size:14px}
@media (max-width:560px){.gloss > div{grid-template-columns:1fr}}

.statuslegend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink-2)}
.statuslegend span{display:inline-flex;gap:6px;align-items:center}
.foot{margin-top:48px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-3);display:grid;gap:4px}

/* Mode recherche */
body.searching section.panel{display:grid !important}
body.searching .si.miss{display:none !important}
body.searching .grp.empty, body.searching section.panel.empty{display:none !important}
body.searching .nosearch{display:none !important}
@media (prefers-reduced-motion:no-preference){section.panel{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

<header class="top">
  <div class="gut"><div class="inner">
    <div class="bar">
      <div class="brand"><h1>Krazystory</h1><small>Aide-mémoire du projet</small></div>
      <div class="tools">
        <label class="search" for="q">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Rechercher : prince, temple, C-04, cercle…" autocomplete="off" aria-label="Rechercher dans tout le projet">
          <button type="button" id="qclear" aria-label="Effacer la recherche" hidden>×</button>
        </label>
        <select id="statut" aria-label="Filtrer par statut">
          <option value="">Tous les statuts</option>
          <option value="canon">CANON</option>
          <option value="source">SOURCE</option>
          <option value="interp">INTERPRÉTATION</option>
          <option value="hyp">HYPOTHÈSE</option>
          <option value="prop">PROPOSITION</option>
          <option value="manq">MANQUANT</option>
          <option value="conflit">CONFLIT</option>
        </select>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="searchinfo" id="searchinfo" hidden></div>
  </div></div>
</header>

<main class="gut"><div class="inner" id="app"></div></main>

<dialog id="lb" aria-label="Image agrandie">
  <div class="lbin">
    <img id="lbimg" alt="">
    <div class="cap"><p id="lbcap"></p><button type="button" id="lbclose">Fermer</button></div>
  </div>
</dialog>

<script>
/* ---------- Images ---------- */
// Chemin des originaux depuis 00_PILOTAGE/. La version publiée en ligne remplace ces deux lignes.
const IMG_BASE = "../SOURCES/images/";
const IMG_EXT = null;
function slug(n){return n.replace(/\.png$/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function src(n){return IMG_EXT ? IMG_BASE + slug(n) + IMG_EXT : IMG_BASE + encodeURIComponent(n)}

/* ---------- Mise en forme des textes ---------- */
const ST = {CANON:"canon",SOURCE:"source","INTERPRÉTATION":"interp",INTERP:"interp","HYPOTHÈSE":"hyp",HYP:"hyp",PROPOSITION:"prop",PROP:"prop",MANQUANT:"manq",MANQ:"manq"};
const LBL = {canon:"CANON",source:"SOURCE",interp:"INTERPRÉTATION",hyp:"HYPOTHÈSE",prop:"PROPOSITION",manq:"MANQUANT",conflit:"CONFLIT"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s){
  s = esc(s);
  s = s.replace(/\{CONFLIT (C-\d+)\}/g,'<span class="st conflit">CONFLIT $1</span>');
  s = s.replace(/\{([A-ZÉÈ]+)\}/g,(m,k)=>ST[k]?`<span class="st ${ST[k]}">${LBL[ST[k]]}</span>`:m);
  s = s.replace(/\[([^\]\[]+?\.(?:md|png)(?::[\d,\-]+)?)\]/g,'<span class="ref">$1</span>');
  s = s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s = s.replace(/✱/g,'<span class="star" title="Proposé par l\'assistant, puis validé">✱</span>');
  return s;
}
const ul = arr => `<ul>${arr.map(x=>`<li class="si">${fmt(x)}</li>`).join("")}</ul>`;
const table = (head, rows, cls="") => `<div class="tbl"><table class="${cls}"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr class="si${r._cls?" "+r._cls:""}">${(r.c||r).map((c,i)=>`<td${r._td&&r._td[i]?` class="${r._td[i]}"`:""}>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ---------- Données (extraites de la base, état au 2026-11-09) ---------- */
const IMAGES = [
  ["A style.png","A","Cheveux bruns aux mèches turquoise en queue de cheval, masque noir, yeux verts ; grande lame rectangulaire remplie de mana vert. Style anime."],
  ["A style 2.png","A","Cheveux noirs en queue de cheval, yeux verts, col remonté ; la lame remplie de mana coule. Style anime sombre."],
  ["A style 3.png","A","Cheveux argentés, yeux verts, manteau blanc ; même lame. Couleur de cheveux divergente."],
  ["A style 4.png","A","Version chibi : cheveux bruns, masque, tenue ninja ; lame qui goutte."],
  ["A meditate.png","A","Méditation dans un dojo en bois ; deux cercles lumineux superposés sur le torse (double noyau ?)."],

const q = document.getElementById("q"), qclear = document.getElementById("qclear"), sel = document.getElementById("statut"), info = document.getElementById("searchinfo");
function hl(el, terms){
  if(!terms.length){ if(el._hl){el.innerHTML = el._orig; el._hl=false} return; }
  el.innerHTML = el._orig; el._hl = true;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const t = n.nodeValue, nt = norm(t); let ranges=[];
    terms.forEach(term=>{ let i=0; while((i=nt.indexOf(term,i))>-1){ ranges.push([i,i+term.length]); i+=term.length; } });
    if(!ranges.length) return;
    ranges.sort((a,b)=>a[0]-b[0]);
    const frag=document.createDocumentFragment(); let pos=0;
    ranges.forEach(([a,b])=>{ if(a<pos) return; frag.append(t.slice(pos,a)); const m=document.createElement("mark"); m.textContent=t.slice(a,b); frag.append(m); pos=b; });
    frag.append(t.slice(pos)); n.replaceWith(frag);
  });
}
function apply(){
  const raw = q.value.trim(), st = sel.value;

  let n = 0;
  items.forEach(el=>{
    const ok = (!terms.length || terms.every(t=>el._t.includes(t))) && (!st || el._st.has(st));
    el.classList.toggle("miss", active && !ok);
    if(active && ok) n++;
    hl(el, active && ok ? terms : []);
  });

  document.querySelectorAll(".grp, .box, .grid, .tbl, .hero-card, .hero, .gallery, .gloss, .tl, .duo, .progress, .kv").forEach(g=>{

    g.classList.toggle("empty", active && !has && !!g.querySelector(".si"));
  });
  document.querySelectorAll(".grp, .box, .grid, .tbl, .hero-card, .hero, .gallery, .gloss, .tl").forEach(g=>{ if(g.classList.contains("empty")) g.style.display = "none"; else g.style.display = ""; });

    document.querySelectorAll(".contra").forEach(c=>c.hidden=false);
    document.querySelectorAll(".gallery figure").forEach(f=>f.hidden=false);

    document.querySelectorAll(".grp, .box, .grid, .tbl, .hero-card, .hero, .gallery, .gloss, .tl").forEach(g=>g.style.display="");
    show(current); applyCFilter(); applyGFilter();
  }
}
